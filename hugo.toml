# Klubben Gurreparken — Hugo-siteconfig
# repos > github-pages: https://klubbengureparken.dk
baseURL = "https://klubbengureparken.dk/"
title = "Klubben Gurreparken"
locale = "da-dk"
defaultContentLanguage = "da"
theme = "PaperMod"
enableGitInfo = false

# ingen kategorier/tags/rss — fire sider, intet mere
disableKinds = ["taxonomy", "term", "rss"]

# kodeblokke i papirfarve — ellers kommer chromas mørke standardblok oven i det lyse tema
[markup]
  [markup.highlight]
    style = "solarized-light"

[menu]
[[menu.main]]
name = "Forside"
pageRef = "/"
weight = 1
[[menu.main]]
name = "Det koster"
pageRef = "/det-koster/"
weight = 2
[[menu.main]]
name = "Faciliteter"
pageRef = "/faciliteter/"
weight = 3
[[menu.main]]
name = "Regler"
pageRef = "/regler/"
weight = 4
[[menu.main]]
name = "Events"
pageRef = "/events/"
weight = 5
[[menu.main]]
name = "Find os"
pageRef = "/find-os/"
weight = 6
[[menu.main]]
name = "Historie"
pageRef = "/historie/"
weight = 7

[params]
# lys papir altid — slår mørk tilstand og dens JS helt fra; med defaultTheme = "light" udsendes heller intet auto-theme-script
defaultTheme = "light"
disableThemeToggle = true
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
ShowWordCount = false
ShowBreadCrumbs = false

[params.assets]
# browserens fanefarve matcher papiret
theme_color = "#efe6cd"
