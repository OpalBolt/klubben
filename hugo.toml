# klubben — Hugo-siteconfig
# EXAMPLE i baseURL: udskiftes med GitHub-brugernavnet, når repoet pushes
baseURL = "https://EXAMPLE.github.io/klub/"
title = "klubben"
locale = "da-dk"
defaultContentLanguage = "da"
theme = "PaperMod"
enableGitInfo = false

# ingen kategorier/tags/rss — fire sider, intet mere
disableKinds = ["taxonomy", "term", "rss"]

[menu]
[[menu.main]]
name = "Forside"
pageRef = "/"
weight = 1
[[menu.main]]
name = "Events"
pageRef = "/events/"
weight = 2
[[menu.main]]
name = "Find os"
pageRef = "/find-os/"
weight = 3
[[menu.main]]
name = "Historie"
pageRef = "/historie/"
weight = 4

[params]
# lys papir altid — slår mørk tilstand og dens JS helt fra; med defaultTheme = "light" udsendes heller intet auto-theme-script
defaultTheme = "light"
disableThemeToggle = true
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
ShowWordCount = false
ShowBreadCrumbs = false

[params.assets]
# browserens fanefarve matcher papiret
theme_color = "#f7f0e0"
