name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # én gang dagligt — begivenheder redigeres kun i kalenderen
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
      - name: Hent kalenderen
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: |
          if [ -n "$CALENDAR_ID" ]; then
            mise exec -- python scripts/fetch_events.py --calendar-id "$CALENDAR_ID" --out data/calendar.json
          else
            echo 'CALENDAR_ID ikke sat — bygger uden begivenheder'
          fi
      - name: Byg sitet
        run: mise exec -- hugo --minify --gc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
